name: Smoke

# Login only. These tests create no records, so they are safe to run on
# every push and pull request. The creation specs live in full-suite.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  login:
    name: Login tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run login tests
        run: npx playwright test tests/login.spec.ts --project=chromium
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          POLLEASY_USERNAME: ${{ secrets.POLLEASY_USERNAME }}
          POLLEASY_PASSWORD: ${{ secrets.POLLEASY_PASSWORD }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 14
