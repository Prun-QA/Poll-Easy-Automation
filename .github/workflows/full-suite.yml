name: Full suite

# Manual only, on purpose: every creation spec writes a real record to the
# shared PollEasy workspace and nothing is cleaned up afterwards. One run
# leaves roughly eight records behind, including a workspace membership.
# Move this onto a schedule once teardown exists or a dedicated QA tenant
# is available.

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser engine to run against
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
      spec:
        description: 'Spec to run (blank = all specs)'
        type: string
        default: ''

jobs:
  e2e:
    name: ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ inputs.browser }}
        run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ inputs.browser }}

      # Inputs are passed through env rather than interpolated into the
      # command, so a crafted value cannot run as shell.
      - name: Run tests
        run: npx playwright test $SPEC --project="$BROWSER"
        env:
          SPEC: ${{ inputs.spec }}
          BROWSER: ${{ inputs.browser }}
          BASE_URL: ${{ secrets.BASE_URL }}
          POLLEASY_USERNAME: ${{ secrets.POLLEASY_USERNAME }}
          POLLEASY_PASSWORD: ${{ secrets.POLLEASY_PASSWORD }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.browser }}
          path: playwright-report/
          retention-days: 14
